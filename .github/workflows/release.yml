name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version bump (alpha publishes the next 0.x.y-alpha.N under the alpha dist-tag)'
        required: true
        type: choice
        options:
          - alpha
          - patch
          - minor
          - major

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - run: bun install --frozen-lockfile
      - run: cd example && bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Publishes expo-scene-accessories, then the @magrinj/expo-scene-accessories alias
      # (release-it `after:release` hook in package.json).
      - name: Release
        run: |
          if [ "${{ inputs.increment }}" = "alpha" ]; then
            bun run release -- --preRelease=alpha --ci
          else
            bun run release -- ${{ inputs.increment }} --ci
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed until trusted publishing is configured for both packages (see CONTRIBUTING).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
